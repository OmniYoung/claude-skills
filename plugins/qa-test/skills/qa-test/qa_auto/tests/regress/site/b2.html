<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>운영 쓰기 안전망 점검</title>
<!-- 글자 아닌 blocklist 'send' 가 스크립트 파일 이름에 걸리면 안 된다 -->
<script src="/js/sendbird.min.js"></script>
</head>
<body>
<h1 id="title">안전망 점검</h1>
<div id="marker">none</div>
<!-- 내장 blocklist 우회: 버튼 안 아이콘 · Enter · onclick 을 단 div 안 아이콘. 대조군은 '목록' -->
<button id="send"><span class="ico" style="display:inline-block;width:10px;height:10px;background:#888"></span>알림톡 발송</button>
<button id="send2">알림톡 발송</button>
<div id="sdiv" onclick="post('send_div')" style="display:inline-block;padding:4px;border:1px solid #ccc"><span class="ico" style="display:inline-block;width:10px;height:10px;background:#888"></span> 문자 발송</div>
<button id="list"><span class="ico" style="display:inline-block;width:10px;height:10px;background:#888"></span>목록</button>
<!-- 글자 없는 이미지 · 아이콘 버튼: 링크 안 img alt · img 자체 · 링크 안 <i title> · input image · aria-label 아이콘 · svg title.
     대조군은 아이콘 alt 가 든 행 (행은 안의 아이콘 글자를 읽지 않음) -->
<a id="imgsend" href="#" onclick="post('send_img');return false"><img alt="알림톡 발송" width="16" height="16" src="data:image/gif;base64,R0lGODlhAQABAIAAAP///wAAACH5BAEAAAAALAAAAAABAAEAAAICRAEAOw=="></a>
<a id="imgsend2" href="#" onclick="post('send_img2');return false"><img alt="문자 발송" width="16" height="16" src="data:image/gif;base64,R0lGODlhAQABAIAAAP///wAAACH5BAEAAAAALAAAAAABAAEAAAICRAEAOw=="></a>
<a id="icosend" href="#" onclick="post('send_ico');return false"><i title="발송" style="display:inline-block;width:12px;height:12px;background:#888"></i></a>
<form id="fimg" onsubmit="post('send_imgin');return false"><input type="image" id="imgin" alt="발송하기" width="16" height="16" src="data:image/gif;base64,R0lGODlhAQABAIAAAP///wAAACH5BAEAAAAALAAAAAABAAEAAAICRAEAOw=="></form>
<a id="arsend" href="#" onclick="post('send_aria');return false"><span aria-label="알림톡 발송" style="display:inline-block;width:12px;height:12px;background:#888"></span></a>
<button id="svgsend" onclick="post('send_svg')"><svg width="12" height="12"><title>발송</title><rect width="12" height="12"/></svg></button>
<table><tr id="row1" onclick="mark('row')"><td class="no">1001</td><td><img alt="발송완료" width="16" height="16" src="data:image/gif;base64,R0lGODlhAQABAIAAAP///wAAACH5BAEAAAAALAAAAAABAAEAAAICRAEAOw=="></td></tr></table>
<!-- 입력칸 줄바꿈 · Enter 로 제출되는 폼 (제출 버튼 글자 '알림톡 발송') -->
<form data-w="send_typenl" onsubmit="post(this.dataset.w);return false"><input id="msg"><button type="submit">알림톡 발송</button></form>
<form data-w="send_typecr" onsubmit="post(this.dataset.w);return false"><input id="msgr"><button type="submit">알림톡 발송</button></form>
<form data-w="send_pressnl" onsubmit="post(this.dataset.w);return false"><input id="msg2"><button type="submit">알림톡 발송</button></form>
<!-- 쓰기 키 없는 클릭: 글자 없이 이미지 alt 만 '삭제' 인 GET 링크 -->
<a id="imgdel" href="/api/wget?what=del_img"><img alt="삭제" width="16" height="16" src="data:image/gif;base64,R0lGODlhAQABAIAAAP///wAAACH5BAEAAAAALAAAAAABAAEAAAICRAEAOw=="></a>
<!-- GET 쓰기 의심: 선택 변경 · 1초 뒤 · 다른 호스트 · 무시 목록 경로 -->
<select id="st"><option value="1">대기</option><option value="2">진행</option></select>
<button id="lazyget">보기</button>
<button id="xget">외부</button>
<button id="statget">통계</button>
<a id="rmlink" href="/api/wget?what=del_item">항목 정리</a>
<!-- 입력 검증 누락: 빈 폼인데 알럿 없이 바로 제출 요청 -->
<form id="apply"><input name="name"><button id="submit" type="button">신청하기</button></form>
<!-- ignore_requests: 검수 사이트 로그 · 다른 호스트 로그 -->
<button id="logbtn">기록 A</button>
<button id="xlog2">기록 B</button>
<button id="xlog">기록 C</button>
<!-- 탐색 헬퍼: 저장 POST · 확인창 삭제 · GET 으로 보내는 발송 -->
<button id="xsave">저장</button>
<button id="xdel">삭제</button>
<button id="xsendget">알림톡 발송</button>
<script>
var X = 'http://localhost:' + location.port;
function mark(t) { document.getElementById('marker').textContent = t; }
function post(what) {
  return fetch('/api/write?what=' + what, {method: 'POST'})
    .then(function (r) { if (r.ok) mark(what); })
    .catch(function () { mark('blocked'); });
}
function get(u) { return fetch(u).then(function () { mark('got'); }).catch(function () {}); }
function postTo(u) { return fetch(u, {method: 'POST', body: 'e=1'}).then(function () { mark('logged'); }).catch(function () {}); }
document.getElementById('send').onclick = function () { post('send_icon'); };
document.getElementById('send2').onclick = function () { post('send_enter'); };
document.getElementById('list').onclick = function () { mark('list'); };
document.getElementById('st').onchange = function () { get('/api/wget?what=status_update'); };
document.getElementById('lazyget').onclick = function () {
  setTimeout(function () { get('/api/wget?what=delay_toggle'); }, 1000);
};
document.getElementById('xget').onclick = function () { get(X + '/api/wget?what=remote_save'); };
document.getElementById('statget').onclick = function () { get('/api/stat/update?x=1'); };
document.getElementById('submit').onclick = function () { post('apply'); };
document.getElementById('logbtn').onclick = function () { postTo('/api/log'); };
document.getElementById('xlog2').onclick = function () { postTo(X + '/api/log2'); };
document.getElementById('xlog').onclick = function () { postTo(X + '/api/log'); };
document.getElementById('xsave').onclick = function () { post('xsave'); };
document.getElementById('xdel').onclick = function () {
  if (confirm('삭제하시겠습니까?')) post('xdel'); else mark('cancelled');
};
document.getElementById('xsendget').onclick = function () { get('/api/wget?what=send_get'); };
</script>
</body></html>
