<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>재실행 화면</title></head>
<body>
<h1 id="t">재실행</h1>
<script>
// 같은 탭에서 처음 열면 문구가 기대와 다르고(1차 실패), 다시 열면 그 요소가 없다(재실행 점검 필요)
var n = +(sessionStorage.getItem('r') || 0); sessionStorage.setItem('r', n + 1);
if (n % 2 === 0) {
  var d = document.createElement('div'); d.id = 'v'; d.textContent = 'A'; document.body.appendChild(d);
}
</script>
</body></html>
